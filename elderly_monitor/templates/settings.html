{% extends "base.html" %}
{% block title %}邮件设置 - 养老监护预警系统{% endblock %}
{% block content %}
<div class="card">
  <h1>邮件设置</h1>
  <p class="muted">配置发件邮箱（SMTP），老人出现异常时系统会把实时截图邮件推送给联系人。</p>
  <p class="muted">常见配置：QQ 邮箱 smtp.qq.com:465（SSL），授权码在「设置→账户→开启 SMTP」获取；163 邮箱 smtp.163.com:465。发件用「授权码」，不是登录密码。</p>
  <form method="post">
    <div class="row">
      <div>
        <label>SMTP 服务器</label>
        <input type="text" name="smtp_host" value="{{ cfg.get('smtp_host','') }}">
      </div>
      <div>
        <label>端口</label>
        <input type="number" name="smtp_port" value="{{ cfg.get('smtp_port','465') }}">
      </div>
    </div>
    <label>发件邮箱</label>
    <input type="email" name="smtp_user" value="{{ cfg.get('smtp_user','') }}" placeholder="you@qq.com">
    <label>授权码 / 应用专用密码</label>
    <input type="password" name="smtp_auth_code" value="{{ cfg.get('smtp_auth_code','') }}">
    <label>发件人显示名</label>
    <input type="text" name="sender_name" value="{{ cfg.get('sender_name','养老监护预警系统') }}">
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px">
      <input type="checkbox" name="smtp_ssl" style="width:auto"
             {% if cfg.get('smtp_ssl','true') in ('true','1','True') %}checked{% endif %}>
      使用 SSL 加密（端口 465；关闭则用 STARTTLS，端口 587）
    </label>
    <label>手动收件人（逗号分隔，留空则自动发给所有注册用户邮箱）</label>
    <textarea name="recipient_emails" rows="2">{{ cfg.get('recipient_emails','') }}</textarea>
    <div style="margin-top:18px">
      <button type="submit">保存设置</button>
    </div>
  </form>
</div>

<div class="card">
  <h1>测试邮件通道</h1>
  <p class="muted">保存设置后，点击发送一封测试邮件到当前收件人，验证配置是否正确。</p>
  <form method="post" action="{{ url_for('settings_test') }}">
    <button type="submit" class="btn">发送测试邮件</button>
  </form>
</div>
{% endblock %}
