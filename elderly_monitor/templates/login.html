{% extends "base.html" %}
{% block title %}登录 - 养老监护预警系统{% endblock %}
{% block content %}
<div class="card auth-box">
  <h1>登录</h1>
  <form method="post">
    <label>用户名</label>
    <input type="text" name="username" required autofocus>
    <label>密码</label>
    <input type="password" name="password" required>
    <div style="margin-top:18px">
      <button type="submit">登录</button>
    </div>
  </form>
  <p class="muted" style="margin-top:16px">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
</div>
{% endblock %}
